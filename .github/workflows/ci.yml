name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format + Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit tests (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System dependencies (PortAudio for sounddevice/pyaudio, Tk + Xvfb for pyautogui)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libportaudio2 portaudio19-dev python3-tk xvfb espeak-ng
      - name: Install project dependencies (same requirements.txt as install.sh; CPU torch wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: pytest
        run: xvfb-run -a python -m pytest -q

  smoke:
    name: Build smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libportaudio2 portaudio19-dev python3-tk xvfb espeak-ng
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Byte-compile and import entry points
        run: |
          python -m compileall -q jarvis tests
          xvfb-run -a python -c "import jarvis.web, jarvis.tools.router, jarvis.context, jarvis.memory; print('smoke ok')"
      - name: Compose config is valid
        run: POSTGRES_PASSWORD=ci docker compose -f infra/docker/docker-compose.yml config -q
